# Proxy reverso na frente do servico web (bonus).
# Unico ponto de entrada do ambiente: escuta na 80 do conteiner,
# publicada como 8080 no host pelo docker-compose.yml.

server {
    listen 80;

    # O nginx limita o corpo da requisicao a 1 MB por padrao.
    # Fotos de celular passam disso e seriam recusadas com erro 413,
    # entao o limite e elevado para os uploads do POST /itens.
    client_max_body_size 10m;

    # DNS interno do Docker. Com "valid=10s", o nginx volta a consultar
    # o nome "web" periodicamente, em vez de guardar o IP para sempre.
    # Sem isso, recriar o conteiner web (que muda de IP) quebraria o
    # proxy, e replicas novas criadas com --scale nao seriam vistas.
    resolver 127.0.0.11 valid=10s;

    location / {
        # Usar uma variavel obriga o nginx a resolver o nome a cada
        # requisicao (respeitando o "valid" acima). Quando ha varias
        # replicas, o DNS devolve todos os IPs e o nginx alterna entre eles.
        set $upstream http://web:5000;
        proxy_pass $upstream;

        # Repassa ao Flask os dados originais do cliente.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
